<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Doctors | MediCare</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container">
<div class="page-header"><div><span class="eyebrow">Administration</span><h1>Doctors</h1></div><a class="btn primary" th:href="@{/doctors/new}">+ Add Doctor</a></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<form class="search-bar" method="get" th:action="@{/doctors}"><input name="keyword" th:value="${keyword}" placeholder="Search by name or specialization"><button class="btn secondary" type="submit">Search</button></form>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Specialization</th><th>Phone</th><th>Email</th><th>Available</th><th>Actions</th></tr></thead>
<tbody><tr th:each="doctor : ${doctors}">
<td th:text="${doctor.name}"></td><td th:text="${doctor.specialization}"></td><td th:text="${doctor.phone}"></td><td th:text="${doctor.email}"></td>
<td th:text="${doctor.availableTime}"></td><td class="actions"><a th:href="@{/doctors/{id}(id=${doctor.id})}">View</a><a th:href="@{/doctors/edit/{id}(id=${doctor.id})}">Edit</a>
<form th:action="@{/doctors/delete/{id}(id=${doctor.id})}" method="post" class="inline-form">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="danger-link" type="submit" data-confirm="Delete this doctor?">Delete</button></form></td>
</tr><tr th:if="${#lists.isEmpty(doctors)}"><td colspan="6" class="empty">No doctors found.</td></tr></tbody></table></div>
</main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/app.js}"></script></body></html>
