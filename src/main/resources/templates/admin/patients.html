<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Patients</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><div class="page-header"><div><span class="eyebrow">Administration</span><h1>Patients</h1></div><a class="btn primary" th:href="@{/patients/new}">+ Add Patient</a></div><div th:replace="~{fragments/alerts :: alerts}"></div>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Email</th><th>Actions</th></tr></thead><tbody>
<tr th:each="patient : ${patients}"><td th:text="${patient.name}"></td><td th:text="${patient.age}"></td><td th:text="${patient.gender}"></td><td th:text="${patient.phone}"></td><td th:text="${patient.email}"></td><td class="actions"><a th:href="@{/patients/{id}(id=${patient.id})}">View</a><a th:href="@{/patients/edit/{id}(id=${patient.id})}">Edit</a><form class="inline-form" method="post" th:action="@{/patients/delete/{id}(id=${patient.id})}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}"><button type="submit" class="danger-link" data-confirm="Delete this patient?">Delete</button></form></td></tr>
<tr th:if="${#lists.isEmpty(patients)}"><td colspan="6" class="empty">No patients found.</td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/app.js}"></script></body></html>
