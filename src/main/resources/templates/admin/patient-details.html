<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Patient Details</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container narrow"><div class="profile-card"><div class="avatar">P</div><span class="eyebrow">Patient</span><h1 th:text="${patient.name}"></h1><div class="detail-list"><p><b>Age:</b> <span th:text="${patient.age}"></span></p><p><b>Gender:</b> <span th:text="${patient.gender}"></span></p><p><b>Phone:</b> <span th:text="${patient.phone}"></span></p><p><b>Email:</b> <span th:text="${patient.email}"></span></p><p><b>Address:</b> <span th:text="${patient.address}"></span></p></div><a class="btn primary" th:href="@{/patients/edit/{id}(id=${patient.id})}">Edit</a><a class="btn secondary" th:href="@{/patients}">Back</a></div></main></body></html>
