<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Appointments</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><div class="page-header"><div><span class="eyebrow">Administration</span><h1>Appointments</h1></div></div><div th:replace="~{fragments/alerts :: alerts}"></div>
<div class="table-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>Doctor</th><th>Patient</th><th>Problem</th><th>Status</th><th>Actions</th></tr></thead><tbody>
<tr th:each="a : ${appointments}">
<td th:text="${a.appointmentDate}"></td><td th:text="${a.appointmentTime}"></td>
<td><span th:each="d : ${doctors}" th:if="${d.id == a.doctorId}" th:text="${d.name}"></span></td>
<td><span th:each="p : ${patients}" th:if="${p.id == a.patientId}" th:text="${p.name}"></span></td>
<td th:text="${a.problem}"></td><td><span class="badge" th:classappend="${a.status.name().toLowerCase()}" th:text="${a.status}"></span></td>
<td class="actions"><a th:href="@{/appointments/edit/{id}(id=${a.id})}">Edit</a>
<form class="inline-form" method="post" th:action="@{/appointments/status/{id}(id=${a.id})}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}"><input type="hidden" name="status" value="CONFIRMED"><button type="submit">Confirm</button></form>
<form class="inline-form" method="post" th:action="@{/appointments/status/{id}(id=${a.id})}"><input type="hidden" name="status" value="COMPLETED"><button type="submit">Complete</button></form>
<form class="inline-form" method="post" th:action="@{/appointments/status/{id}(id=${a.id})}"><input type="hidden" name="status" value="CANCELLED"><button type="submit" class="danger-link">Cancel</button></form>
<form class="inline-form" method="post" th:action="@{/appointments/delete/{id}(id=${a.id})}"><button type="submit" class="danger-link" data-confirm="Delete this appointment?">Delete</button></form></td></tr>
<tr th:if="${#lists.isEmpty(appointments)}"><td colspan="7" class="empty">No appointments found.</td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/app.js}"></script></body></html>
