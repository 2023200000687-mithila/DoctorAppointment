<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Find Doctors</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><div class="page-header"><div><span class="eyebrow">Patient portal</span><h1>Find a Doctor</h1></div></div>
<form class="search-bar" method="get" th:action="@{/patient/doctors}"><input name="keyword" th:value="${keyword}" placeholder="Search doctor name or specialization"><button class="btn primary">Search</button></form>
<div class="doctor-grid"><article class="doctor-card" th:each="d : ${doctors}"><div class="avatar">Dr</div><h3 th:text="${d.name}"></h3><p th:text="${d.specialization}"></p><p class="muted" th:text="${d.availableTime}"></p><a th:href="@{/patient/doctors/{id}(id=${d.id})}">View details →</a></article></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
