<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Patient Dashboard</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><div class="page-header"><div><span class="eyebrow">Patient portal</span><h1>Welcome, <span th:text="${patient.name}"></span></h1><p class="muted">Manage your healthcare appointments.</p></div><a class="btn primary" th:href="@{/patient/appointments/new}">+ Book Appointment</a></div>
<div class="stat-grid"><div class="stat-card"><span>Pending</span><strong th:text="${pendingCount}">0</strong></div><div class="stat-card"><span>Confirmed</span><strong th:text="${confirmedCount}">0</strong></div><div class="stat-card"><span>Cancelled</span><strong th:text="${cancelledCount}">0</strong></div></div>
<section class="section compact"><div class="section-heading"><span class="eyebrow">Doctors</span><h2>Available doctors</h2></div><div class="doctor-grid"><article class="doctor-card" th:each="d : ${doctors}"><div class="avatar">Dr</div><h3 th:text="${d.name}"></h3><p th:text="${d.specialization}"></p><a th:href="@{/patient/doctors/{id}(id=${d.id})}">View profile →</a></article></div></section>
<section class="section compact"><div class="section-heading"><h2>My recent appointments</h2></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>Problem</th><th>Status</th></tr></thead><tbody><tr th:each="a : ${appointments}"><td th:text="${a.appointmentDate}"></td><td th:text="${a.appointmentTime}"></td><td th:text="${a.problem}"></td><td><span class="badge" th:classappend="${a.status.name().toLowerCase()}" th:text="${a.status}"></span></td></tr><tr th:if="${#lists.isEmpty(appointments)}"><td colspan="4" class="empty">You have no appointments yet.</td></tr></tbody></table></div></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
