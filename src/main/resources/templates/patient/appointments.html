<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Appointments</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><div class="page-header"><div><span class="eyebrow">Patient portal</span><h1>My Appointments</h1></div><a class="btn primary" th:href="@{/patient/appointments/new}">+ Book Appointment</a></div><div th:replace="~{fragments/alerts :: alerts}"></div>
<div class="table-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>Doctor ID</th><th>Problem</th><th>Status</th><th>Actions</th></tr></thead><tbody>
<tr th:each="a : ${appointments}"><td th:text="${a.appointmentDate}"></td><td th:text="${a.appointmentTime}"></td><td th:text="${a.doctorId}"></td><td th:text="${a.problem}"></td><td><span class="badge" th:classappend="${a.status.name().toLowerCase()}" th:text="${a.status}"></span></td><td class="actions"><a th:if="${a.status.name() != 'CANCELLED' and a.status.name() != 'COMPLETED'}" th:href="@{/patient/appointments/edit/{id}(id=${a.id})}">Edit</a><form th:if="${a.status.name() != 'CANCELLED' and a.status.name() != 'COMPLETED'}" class="inline-form" method="post" th:action="@{/patient/appointments/cancel/{id}(id=${a.id})}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="danger-link" type="submit" data-confirm="Cancel this appointment?">Cancel</button></form></td></tr>
<tr th:if="${#lists.isEmpty(appointments)}"><td colspan="6" class="empty">No appointments found.</td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/app.js}"></script></body></html>
